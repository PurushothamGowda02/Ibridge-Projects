<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>RFM API Diagnostic Test</h1>
    
    <div id="results"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        const resultsDiv = document.getElementById('results');

        async function runTests() {
            // Test 1: Health Check
            await testEndpoint('/api/health', 'Health Check');
            
            // Test 2: RFM Data
            await testEndpoint('/api/rfm', 'RFM Data (first 3 records)');
            
            // Test 3: Segments Summary
            await testEndpoint('/api/segments/summary', 'Segments Summary');
        }

        async function testEndpoint(endpoint, name) {
            const div = document.createElement('div');
            div.className = 'test';
            
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`);
                const data = await response.json();
                
                if (response.ok) {
                    div.className += ' success';
                    let displayData = data;
                    if (Array.isArray(data) && data.length > 3) {
                        displayData = data.slice(0, 3);
                        displayData.push(`... and ${data.length - 3} more records`);
                    }
                    div.innerHTML = `
                        <h3>✓ ${name}</h3>
                        <p>Status: ${response.status}</p>
                        <pre>${JSON.stringify(displayData, null, 2)}</pre>
                    `;
                } else {
                    div.className += ' error';
                    div.innerHTML = `
                        <h3>✗ ${name}</h3>
                        <p>Status: ${response.status}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                div.className += ' error';
                div.innerHTML = `
                    <h3>✗ ${name}</h3>
                    <p>Error: ${error.message}</p>
                    <p>Make sure the backend is running at ${API_BASE_URL}</p>
                `;
            }
            
            resultsDiv.appendChild(div);
        }

        // Run tests when page loads
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
