version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: lms_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - lms_network

  backend:
    build: ./backend
    container_name: lms_backend
    env_file: .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=lms_enterprise
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - lms_network

  frontend:
    build: ./lms_frontend
    container_name: lms_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  mongodb_data:
