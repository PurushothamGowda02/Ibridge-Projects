<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MetroOptima</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }
        .auth-card .logo-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 2rem;
            text-align: left;
        }
        .auth-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 0.5rem;
            font-family: inherit;
        }
        .auth-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        .flash-msg {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="auth-container">
        <div class="card auth-card">
            <i class="fa-solid fa-train-subway logo-icon" style="color: var(--accent-primary);"></i>
            <h2>Create Account</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.875rem;">Bengaluru Namma Metro Control</p>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-msg" style="margin-top: 1rem;">
                  {% for message in messages %}
                    <div>{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST" action="{{ url_for('register') }}">
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-secondary);">Email Address</label>
                    <input type="email" name="email" class="auth-input" required autofocus>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-secondary);">Password</label>
                    <input type="password" name="password" class="auth-input" required>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-secondary);">Role</label>
                    <select name="role" class="auth-input" style="background-color: #2D3748; color: white;">
                        <option value="user">User (Passenger)</option>
                        <option value="admin">Admin (System Operator)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem;">Register</button>
            </form>
            
            <p style="margin-top: 2rem; font-size: 0.875rem; color: var(--text-secondary);">
                Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-primary); text-decoration: none;">Sign in</a>
            </p>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
