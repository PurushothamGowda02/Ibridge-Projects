# Virtual Brain Assistant Configuration

# LLM Configuration
llm:
  provider: groq  # Options: openai, huggingface, groq, local
  model: llama-3.3-70b-versatile  # Fast free model via Groq
  temperature: 0.7
  max_tokens: 512
  timeout: 60  # Increased timeout for API calls

# Memory System Configuration
memory:
  vector_store: faiss  # Options: faiss, chromadb
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  persist_directory: ./data/memory
  max_conversation_history: 50
  similarity_threshold: 0.7
  top_k_results: 5

# Voice Configuration
voice:
  input_enabled: true
  output_enabled: true
  language: en-US
  speech_recognition_timeout: 5
  tts_rate: 150
  tts_volume: 1.0

